<!doctype html><html lang="en"><meta charset="utf-8"><title>Popup preview</title><style>body{margin:0;background:#e9e9ee;display:grid;place-items:start center;padding:20px}iframe{width:360px;height:510px;border:1px solid #dddde5;border-radius:10px;background:#f9f9fb}</style><body><script type="module">
window.chrome = { runtime: { sendMessage: async () => ({ok:true,history:[]}) }, storage: {onChanged:{addListener(){}}} };
const frame=document.createElement('iframe');document.body.append(frame);
const html=await(await fetch('../popup.html')).text();
frame.srcdoc=html.replace('<head>','<head><base href="'+location.origin+'/"><script>window.chrome=parent.chrome;<\/script>');
</script></body></html>
